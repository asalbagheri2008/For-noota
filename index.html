<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>یه سؤال کوچولو ♡</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(145deg, #202a3a, #11151e 55%, #080a0f);
  color: #c0ccdc;
  font-family: Tahoma, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
}
.card {
  width: 90%;
  max-width: 390px;
  padding: 30px 22px;
  border: 1px solid #39475b;
  border-radius: 22px;
  background: rgba(16, 21, 30, 0.96);
  box-shadow: 0 15px 45px rgba(0,0,0,.25);
  z-index: 2;
}
.cat { font-size: 58px; margin-bottom: 8px; }
.envelope { font-size: 68px; cursor: pointer; margin: 12px 0; }
h1 { color: #c0ccdc; font-size: 23px; font-weight: normal; line-height: 1.8; }
p { color: #9daabd; font-size: 14px; line-height: 2; }
button {
  border: 1px solid #53657e;
  border-radius: 25px;
  padding: 12px 19px;
  margin: 7px 3px;
  background: #34465d;
  color: #e0e6ef;
  font-size: 14px;
  font-family: Tahoma, sans-serif;
  cursor: pointer;
}
#no { background: #202734; border-color: #424d5d; }
#letter { display: none; }
#answer { margin-top: 18px; color: #c0ccdc; }
.heart {
  position: fixed;
  bottom: -30px;
  color: #657d9a;
  opacity: .65;
  animation: float 8s linear forwards;
  pointer-events: none;
  z-index: 1;
}
@keyframes float {
  0% { transform: translateY(0); opacity: 0; }
  15% { opacity: .65; }
  100% { transform: translateY(-110vh) rotate(35deg); opacity: 0; }
}
</style>
</head>
<body>
<div class="card">
  <div class="cat">🐈‍⬛</div>
  <div class="envelope" onclick="openLetter()">💌</div>
  <div id="start">
    <h1>یه سؤال کوچولو...</h1>
    <p>یه نفر یه چیزی می‌خواد ازت بپرسه ♡</p>
    <button onclick="openLetter()">نامه‌تو باز کن</button>
  </div>
  <div id="letter">
    <h1>دوست‌دخترم می‌شی؟ ♡</h1>
    <p>
      تو برام آدم خیلی خاصی هستی.<br>
      روزام رو یه کم قشنگ‌تر می‌کنی،<br>
      و خواستم اینو بهت بگم.
    </p>
    <button onclick="yesAnswer()">آرههه ♡</button>
    <button id="no" onclick="maybeAnswer()">هنوز مطمئن نیستم</button>
    <p id="answer"></p>
  </div>
</div>
<script>
function openLetter() {
  document.getElementById("start").style.display = "none";
  document.getElementById("letter").style.display = "block";
}
function yesAnswer() {
  document.getElementById("answer").innerHTML =
    "تو الان منو خیلی خوشحال کردی. ♡";
}
function maybeAnswer() {
  document.getElementById("answer").innerHTML =
    "اشکالی نداره، هرچقدر لازم داری وقت بذار. ♡";
}
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = Math.random() > .5 ? "♡" : "♥";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (14 + Math.random() * 15) + "px";
  heart.style.animationDuration = (5 + Math.random() * 5) + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 10000);
}, 800);
</script>
</body>
</html>
